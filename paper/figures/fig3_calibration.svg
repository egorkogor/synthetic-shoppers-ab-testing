  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(24.3 542.569062)">H1: before and after are the same 60 scenarios; shares are among sessions with an add-to-cart.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(24.3 554.571797)">Cards and pages: before is the previous environment version (110 sessions), after is 40; there is no paired control on the same scenarios.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(24.3 566.574531)">H1 and card entries: held-out late period. Search: aggregates of the early period.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(24.3 578.577266)">Points are frequencies; the short segment for search is the bounds of pooling paths, not a confidence interval.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(24.3 590.58)">Checked under the calibration protocol; the figure and the share reconciliation were prepared after the experiment.</text>
  </g>
