   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="378.144" y="165.341389" transform="rotate(-0 378.144 165.341389)">Environment B → actions</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(586.877625 118.726434)">Paired difference B − A</text>
