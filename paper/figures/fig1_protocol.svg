    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="405.1008" y="326.595469" transform="rotate(-0 405.1008 326.595469)">"Always zero"</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(715.224019 251.971798)">Historical outcome</text>
