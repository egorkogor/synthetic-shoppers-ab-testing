   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(366.482948 242.768034)">Direct forecast</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(371.637792 255.370905)">Haiku / Opus</text>
   </g>
