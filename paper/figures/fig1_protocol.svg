  <g id="text_9">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="23.4" y="21.24" transform="rotate(-0 23.4 21.24)">One test: paired scenarios and direct competitors</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(23.4 393.681266)">Unit of accuracy evaluation: a historical A/B test (in the blind set, a comparison of variants). A/B scenarios reduce noise within a test.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(23.4 405.684)">The number of tests depends on the setup (n = 4–36); the bank has 47. Intervals are not shown in the diagram.</text>
  </g>
